server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mesma origem para o navegador: /api -> Query API (sem CORS).
    #
    # O nome `query` é resolvido a cada requisição pelo DNS interno do Docker (127.0.0.11).
    # Com um proxy_pass fixo o nginx guarda o IP da partida; quando o container `query` é
    # recriado ele ganha outro IP e o `web` passa a responder 502 até ser reiniciado.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $query_upstream query:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$query_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
