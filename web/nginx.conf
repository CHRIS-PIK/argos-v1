server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mesma origem para o navegador: /api -> Query API (sem CORS).
    location /api/ {
        proxy_pass http://query:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
