services:
  redis:
    image: redis:7.4-alpine
    container_name: argos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: argos-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest:
    build: .
    container_name: argos-ingest
    restart: unless-stopped
    env_file: .env
    environment:
      SCHEMAS_DIR: /schemas
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-homelab}
      HOST_NAME: ${HOST_NAME:-olympus}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://host.docker.internal:4040}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      PYROSCOPE_MEMORY_ENABLED: ${PYROSCOPE_MEMORY_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./collectors/aruba/schemas:/schemas/aruba:ro
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.ingest.main:app", "--host", "0.0.0.0", "--port", "8000"]

  query:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-query.txt
    container_name: argos-query
    restart: unless-stopped
    env_file: .env
    environment:
      SCHEMAS_DIR: /schemas
      EXPORT_DIR: /exports
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-homelab}
      HOST_NAME: ${HOST_NAME:-olympus}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://host.docker.internal:4040}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      PYROSCOPE_MEMORY_ENABLED: ${PYROSCOPE_MEMORY_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./collectors/aruba/schemas:/schemas/aruba:ro
      - exports_data:/exports
    ports:
      - "8001:8001"
    command: ["uvicorn", "app.query.main:app", "--host", "0.0.0.0", "--port", "8001"]

  web:
    build: ./web
    container_name: argos-web
    restart: unless-stopped
    depends_on:
      - query
    ports:
      - "8080:80"

  collector-aruba:
    build: ./collectors/aruba
    container_name: argos-collector-aruba
    restart: unless-stopped
    env_file: ./collectors/aruba/.env
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-homelab}
      HOST_NAME: ${HOST_NAME:-olympus}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://host.docker.internal:4040}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      PYROSCOPE_MEMORY_ENABLED: ${PYROSCOPE_MEMORY_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ingest
    ports:
      - "9101:9101"
    volumes:
      - token_data:/data

  worker:
    build: .
    container_name: aruba-worker
    restart: unless-stopped
    env_file: .env
    environment:
      SCHEMAS_DIR: /schemas
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-homelab}
      HOST_NAME: ${HOST_NAME:-olympus}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://host.docker.internal:4040}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      PYROSCOPE_MEMORY_ENABLED: ${PYROSCOPE_MEMORY_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./collectors/aruba/schemas:/schemas/aruba:ro
    ports:
      - "9102:9102"
    command: ["python", "-m", "app.worker"]

volumes:
  exports_data:
  clickhouse_data:
  redis_data:
  token_data:
