services:
  mariadb:
    image: mariadb:11.4
    container_name: aruba-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=2G
      - --max-connections=150
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build: .
    container_name: aruba-producer
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-homelab}
      HOST_NAME: ${HOST_NAME:-olympus}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://host.docker.internal:4040}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      PYROSCOPE_MEMORY_ENABLED: ${PYROSCOPE_MEMORY_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "9101:9101"
    volumes:
      - token_data:/data
    command: ["python", "-m", "app.producer"]

  worker:
    build: .
    container_name: aruba-worker
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-homelab}
      HOST_NAME: ${HOST_NAME:-olympus}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://host.docker.internal:4040}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      PYROSCOPE_MEMORY_ENABLED: ${PYROSCOPE_MEMORY_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "9102:9102"
    command: ["python", "-m", "app.worker"]

volumes:
  mariadb_data:
  token_data:
